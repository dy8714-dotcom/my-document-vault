<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイドキュメント保管庫</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============== ログイン画面 ============== -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <h1>マイドキュメント保管庫</h1>
      <p class="login-subtitle">PDF・Excel・Word・Googleドキュメントを<br>1か所にまとめて管理</p>
      <button id="login-btn" class="btn-google">
        <span class="google-icon">G</span>
        Googleアカウントでログイン
      </button>
      <p class="login-note" id="login-status"></p>
    </div>
  </div>

  <!-- ============== メイン画面 ============== -->
  <div id="main-screen" class="main-screen" style="display: none;">

    <!-- ヘッダー -->
    <header class="header">
      <div class="header-title">マイドキュメント保管庫</div>
      <div class="header-user">
        <span id="user-email" class="user-email"></span>
        <button id="logout-btn" class="btn-logout">ログアウト</button>
      </div>
    </header>

    <!-- タブ切替 -->
    <nav class="tabs" id="tabs"></nav>

    <!-- ツールバー -->
    <div class="toolbar">
      <button id="add-file-btn" class="btn-primary">+ ファイル追加</button>
      <button id="refresh-btn" class="btn-secondary">↻ 更新</button>
      <span class="status-text" id="status-text"></span>
    </div>

    <!-- セルグリッド -->
    <main class="grid-container">
      <div id="grid" class="grid"></div>
    </main>

    <!-- フッター -->
    <footer class="footer">
      <span id="footer-info">読み込み中...</span>
    </footer>

  </div>

  <!-- ============== ファイルアップロード用の隠しinput ============== -->
  <input type="file" id="file-input" style="display: none;">

  <!-- ============== ローディング表示 ============== -->
  <div id="loading" class="loading" style="display: none;">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loading-text">処理中...</div>
  </div>

  <!-- ============== トースト通知 ============== -->
  <div id="toast" class="toast" style="display: none;"></div>

  <!-- ============== Google API 読み込み ============== -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js"></script>

  <!-- Firebase v9 (compat) を使用 -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

  <!-- アプリのコード -->
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
